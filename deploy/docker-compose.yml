# Local S3 server (MinIO) in Docker. Alternative to `make minio`, which needs no Docker.
#   docker compose -f deploy/docker-compose.yml up -d     (or: make minio-up)
# Credentials match deploy/minio.env.
#
# NOTE: MinIO archived its open-source project in 2026. This image tag is the last release we
# know of; if the pull fails, use `make minio` (builds from source) or any S3-compatible server.
services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: beevmdev
      MINIO_ROOT_PASSWORD: beevmdev-secret
    ports:
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10


  # Optional module (M10): Prometheus + Grafana. `make monitoring-up` (or `docker compose
  # -f deploy/docker-compose.yml --profile monitoring up -d`). Host networking so the same
  # prometheus.yml (127.0.0.1:8080) works. NOT TESTED (no Docker on the dev machine); the
  # tested path is `make monitoring` (pinned binaries). Image tags match scripts/common.sh.
  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v3.15.1
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.listen-address=127.0.0.1:9090
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    profiles: [monitoring]
    image: grafana/grafana:13.3.0
    network_mode: host
    environment:
      BEEVM_DASHBOARDS: /var/lib/grafana/dashboards
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/beevm.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  minio-data:
